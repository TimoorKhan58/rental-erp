# Example override for managed / external PostgreSQL (Phase 20 RC1).
#
# Requires Docker Compose v2.24+ (`!override` / `!reset` merge tags).
#
# Usage (do not commit a real override with secrets):
#   cp docker-compose.managed-db.override.example.yml docker-compose.managed-db.override.yml
#   # Point DATABASE_URL in .env.production at the managed instance
#   # (include ?sslmode=require when the provider requires TLS).
#   docker compose -f docker-compose.prod.yml -f docker-compose.managed-db.override.yml \
#     --env-file .env.production --profile migrate run --rm migrate
#   docker compose -f docker-compose.prod.yml -f docker-compose.managed-db.override.yml \
#     --env-file .env.production up --build -d
#
# If your Compose version rejects !override, copy docker-compose.prod.yml to a
# private file and delete the `db` service plus every `depends_on: db` block.

services:
  db:
    # Keep the service definition out of the default project so it never starts.
    # App/migrate no longer depend on it (see !override below).
    profiles: ["disabled-local-db"]

  migrate:
    depends_on: !override {}
    networks:
      - data

  app:
    depends_on: !override
      uploads-init:
        condition: service_completed_successfully
    networks:
      - app
      - data
